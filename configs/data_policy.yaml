schema: synccraft.data-policy/0.3
status: apex_musculoskeletal_and_artist_loop_p1_08_r4
source_plan_scale_targets:
  static_train: 60000
  dynamic_train: 15000
  synthetic_unseen_total: 1200
  external_gold_total: 50
pilot_samples_before_scale: 200
seeds: [17, 29, 43, 2026]
split_by: family_and_body_plan_before_parameter_sampling
curriculum_policy:
  train_val_complexity_tiers:
    tier_1_simple: [4, 8]
    tier_2_medium: [9, 15]
    tier_3_complex: [16, 24]
    tier_4_masterwork: [25, 42]
    tier_5_apex_complex: [32, 68]
  test_unseen_min_boxes_gate_g2: 16
  apex_unseen_min_boxes: 40
  controlled_defect_repair_ratio_train: 0.05
  batch_statistical_qc_required: true
license_quarantine_tracks:
  clean_room_permissive:
    spdx_allowlist: [CC0-1.0, CC-BY-4.0, MIT, Apache-2.0, BSD-3-Clause]
    commercial_weights_eligible: true
    default_hf_release_track: true
  research_nc:
    spdx_allowlist: [CC-BY-NC-4.0, CC-BY-NC-SA-4.0]
    commercial_weights_eligible: false
    requires_attribution_notice: true
    quarantined_split_prefix: research_nc/
    notes: Permits Cobblemon-class CC-BY-NC community assets strictly inside non-commercial research/evaluation splits; never merged into Apache-2.0 commercial weights.
reserved_extension_tracks:
  human_gathered_real_corpus:
    status: gathering_external_permissive_assets_deferred
    macro_domain: humanoid
    notes: Reserved for second-stage real human model dataset after permissive corpus gathering completes.
seen_static_families:
  # Artificial (9)
  - straight_blade_sword
  - single_edge_blade
  - battle_axe
  - spear
  - war_hammer
  - simple_wood_bow
  - furniture_table_chair_chest_cabinet
  - clockwork_pendulum_clock
  - alchemical_workbench_apparatus
  # Industrial, Mechanical Engineering & Vehicles (11)
  - gearbox
  - articulated_robotic_arm
  - industrial_turbine_generator
  - piston_crank_engine
  - cnc_milling_press
  - centrifugal_pump_valve_skid
  - wheeled_haul_truck
  - tracked_excavator
  - steam_rail_locomotive
  - twin_rotor_helicopter_drone
  - cargo_tugboat_vessel
  # Natural (4)
  - ancient_canopy_tree
  - crystalline_geode_outcrop
  - coral_fungal_colony
  - pine_conifer_evergreen
  # Building / Architecture (4)
  - modular_timber_stone_building
  - tiered_pagoda_watchtower
  - arched_stone_bridge_gate
  - waterwheel_millhouse
  # Humanoid (1)
  - humanoid_biped
  # Animal (3)
  - dog_horse_quadruped
  - bird
  - articulated_manta_shark
  # Dragon / Mythic & Prehistoric Draconic Creatures (8)
  - winged_western_dragon
  - quadruped_armored_drake
  - eastern_lung_dragon
  - bipedal_wyvern
  - forelimb_lindworm
  - feathered_raptor
  - winged_amphithere
  - multi_headed_hydra
unseen_static_families:
