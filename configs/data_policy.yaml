  # Natural (1)
  - weeping_bonsai_arch
  # Industrial & Vehicles (5)
  - tripod_telescope
  - anvil_forge
  - hydraulic_gantry_crane
  - articulated_forklift_loader
  - submersible_rov_craft
  # Building / Architecture (2)
  - folding_windmill
  - coastal_lighthouse_keep
  # Animal (2)
  - hexapod_beetle
  - heavy_tail_tyrannosaur
  # Dragon (2)
  - segmented_sea_dragon
  - crowned_zilant
apex_seen_complex_families:
  - apex_flying_wyvern
  - brute_theropod_wyvern
  - pelagic_leviathan_wyvern
  - fanged_thunder_wyvern
  - armored_arthropod_colossus
  - morphing_switch_blade_axe
  - elemental_pocket_companion
  - modular_apricorn_healing_station
apex_unseen_complex_families:
  - elder_calamity_dragon
  - relic_automaton_guardian
seen_body_plans:
  - humanoid_biped
  - dog_horse_quadruped
  - bird
  - articulated_manta_shark
  - winged_western_dragon
  - quadruped_armored_drake
  - eastern_lung_dragon
  - bipedal_wyvern
  - forelimb_lindworm
  - feathered_raptor
  - winged_amphithere
  - multi_headed_hydra
unseen_body_plans:
  - hexapod_beetle
  - heavy_tail_tyrannosaur
  - segmented_sea_dragon
  - crowned_zilant
prohibited_training_sources:
  - original_mojang_models_and_textures
  - third_party_ip_derivatives_without_suitable_rights
  - incompatible_or_unknown_motion_dataset_licenses
  - heldout_g2_or_external_benchmark_assets
required_row_fields:
  - asset_id
  - family_id
  - body_plan_id_if_dynamic
  - generator_revision
  - generator_parameters
  - canonical_dsl
  - canonical_dsl_sha256
  - prompt_and_provenance
  - source_license_and_review_record
  - split
  - audit_version_and_results
  - target_profile_and_version
  - seed
shard_target_megabytes: 500
shard_format: zstd_parquet_and_jsonl_batches
# 800 reviewed CC0 icons is a source-plan ambition, not an existing collection.
reviewed_icon_inventory_present: false
external_gold_inventory_present: false
